name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24' # 与 go.mod 保持一致，禁 stable 漂移
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt 需处理：$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: 单元测试
        run: go test ./...
      - name: 结构契约 + 跨包唯一性 + 工具面覆盖 + 版本同步 + 脱敏扫描
        run: go run ./validator ./packs
