# 起步示例链：两步演示（第一步技能钉扎、第二步聚合收口）。
# 模板变量（平台侧 chainRender 渲染）：{{input}}=会话输入原文；{{host}}=目标机；
# {{summary}}=最近一份上游报告的摘要（第一步执行时无上游报告，恒空串）；
# {{followups}}=最近一份上游报告的待跟进事项（结构化接力指令，无则空串）。
slug: workflow/starter-chain
name: 起步示例链
route_priority: P4
route_group: tooling
route_keywords: [起步链, 示例链]
route_desc: 最小两步示例链（结构演示）：先按钉扎技能口径归类，再收口建议；真实链请替换为领域专家
steps:
  - agent: imports/starter-analyst
    skill: starter-method          # 技能钉扎：本步强制注入技能全文执行（不靠 LLM 自觉 use_skill）
    instruction: "第一步——现象归类与信息缺口（目标机 {{host}}）：{{input}}"
  - agent: imports/starter-analyst
    instruction: "第二步——复核上一步结论（{{summary}}）后给建议与置信度；上一步待跟进事项（无则省略）：{{followups}}；用户原始诉求：{{input}}"
