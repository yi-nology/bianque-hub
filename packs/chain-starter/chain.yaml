# 起步示例链：两步演示（第一步技能钉扎、第二步聚合收口）。
#
# v3 模板变量：{{sys.input}}=会话输入原文；{{sys.host}}=目标机；
# 上一步产出按节点 id 引用：{{n1.output.summary}} / {{n1.output.followups}}。
#
# v3 图模型（spec 2026-10-22 §5.1）：节点 + 边。节点 id 稳定；边=控制流。
slug: workflow/starter-chain
name: 起步示例链
version: 3
route_priority: P4
route_group: tooling
route_keywords: [起步链, 示例链]
route_desc: 最小两步示例链（结构演示）：先按钉扎技能口径归类，再收口建议；真实链请替换为领域专家
nodes:
  - id: n1
    type: agent
    title: 现象归类与信息缺口
    agent: imports/starter-analyst
    skill: starter-method # 技能钉扎：本步强制注入技能全文执行（不靠 LLM 自觉 use_skill）
    instruction: "第一步——现象归类与信息缺口（目标机 {{sys.host}}）：{{sys.input}}"
  - id: n2
    type: agent
    title: 复核上一步并给建议
    agent: imports/starter-analyst
    instruction: "第二步——复核上一步结论（{{n1.output.summary}}）后给建议与置信度；上一步待跟进事项（无则省略）：{{n1.output.followups}}；用户原始诉求：{{sys.input}}"
edges:
  - {from: n1, to: n2}