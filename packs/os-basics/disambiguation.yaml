disambiguation:
- keyword: 审计
  rules:
  - context:
    - 安全
    - 等保
    - CIS
    - 合规
    - 风险
    - audit
    - 审计异常
    target: specialists/security-assistant
    note: 安全审计
  - context:
    - 日志
    - journal
    - 时间线
    target: workflow/log-analysis
    note: 日志审计
  - context:
    - '*'
    action: clarify
    note: 先澄清：您要做的是安全审计还是日志审计？
- keyword: 报错
  rules:
  - context:
    - 排查
    - 全面
    - 诊断
    - 根因
    - 故障
    - 卡顿
    - 很卡
    - 太卡
    - 卡死
    - 变慢
    - 很慢
    - 太慢
    - 性能
    - 负载
    target: workflow/fault-diagnosis
    note: 排查/性能诉求归故障链（「日志里全是报错」是证据位置描述，不改变全面排查诉求；故障链内含日志域专家）
  - context:
    - 日志
    - dmesg
    - journal
    - 时间线
    target: workflow/log-analysis
    note: 日志类报错
  - context:
    - '*'
    target: workflow/fault-diagnosis
    note: 默认归故障链
# ── 口语故障主诉确定性承接（bianque 批次二百七十七：批二百六十四词面评审回访——「系统很卡/
#    连不上/打不开」类最高频故障口语全不在词表，确定性模式直接落 P5 自答；按「报错」同款
#    消歧默认故障链承接。安全语境分支置顶防遮蔽 P0 红线（本层先于 P0 执行））──
- keyword: 很卡
  rules:
  - context:
    - 入侵
    - 后门
    - 挖矿
    - 暴力破解
    - 安全
    target: specialists/security-assistant
    note: 安全语境让位红线
  - context:
    - '*'
    target: workflow/fault-diagnosis
    note: 口语故障主诉归故障链
- keyword: 卡死
  rules:
  - context:
    - 入侵
    - 后门
    - 挖矿
    - 暴力破解
    - 安全
    target: specialists/security-assistant
    note: 安全语境让位红线
  - context:
    - '*'
    target: workflow/fault-diagnosis
    note: 口语故障主诉归故障链
- keyword: 连不上
  rules:
  - context:
    - 入侵
    - 后门
    - 挖矿
    - 暴力破解
    - 安全
    target: specialists/security-assistant
    note: 安全语境让位红线
  - context:
    - '*'
    target: workflow/fault-diagnosis
    note: 口语故障主诉归故障链
- keyword: 打不开
  rules:
  - context:
    - 入侵
    - 后门
    - 挖矿
    - 暴力破解
    - 安全
    target: specialists/security-assistant
    note: 安全语境让位红线
  - context:
    - '*'
    target: workflow/fault-diagnosis
    note: 口语故障主诉归故障链
- keyword: 检查
  rules:
  - context:
    - 脚本
    target: platform/script-assistant
    note: 脚本生成意图（「写个脚本批量检查X」是工具诉求，先于域内检查判定）
  - context_from_symptoms: specialists/security-assistant
    context:
    - 安全
    - 合规
    - 等保
    - CIS
    - 基线
    target: specialists/security-assistant
    note: 安全检查
  - context_from_symptoms: specialists/io-analysis
    context:
    - 空间
    - 容量
    - 存储
    - 挂载
    - inode
    target: specialists/io-analysis
    note: IO/存储域内检查
  - context_from_symptoms: specialists/memory-analysis
    context:
    - NUMA
    target: specialists/memory-analysis
    note: 内存域内检查
  - context_from_symptoms: specialists/network-analysis
    target: specialists/network-analysis
    note: 网络域内检查
  - context:
    - 资源
    - 服务
    - 硬件
    - 健康
    - 状态
    - 巡检
    target: workflow/system-patrol
    note: 例行巡检
  - context:
    - '*'
    target: workflow/system-patrol
    note: 默认归巡检
- keyword: 切换
  rules:
  - context:
    - 巡检
    - 变更前
    - 变更后
    - 对比
    target: workflow/system-patrol
    note: 变更前后巡检对比
  - context:
    - '*'
    target: workflow/fault-diagnosis
    note: 故障场景切换走故障链（执行必经审批闸门）

# ── 跨域歧义消解（批次二百六十四：redhat-kb 红帽文档蒸馏词面评审，ambiguity.md 素材；
#    吸取批次二百六十二「消歧劫持」教训——跨域歧义词进消歧按上下文分流，不塞单域 symptoms）──
- keyword: 内存不足
  rules:
  - context:
    - 性能
    - 卡顿
    - 慢
    - 负载
    target: workflow/perf-tuning
    note: 性能诉求归调优流
  - context:
    - 巡检
    - 健康
    target: workflow/system-patrol
    note: 巡检场景
  - context:
    - '*'
    target: specialists/memory-analysis
    note: 默认归内存分析
- keyword: iowait
  rules:
  - context:
    - 性能
    - 调优
    - 瓶颈
    target: workflow/perf-tuning
    note: 性能调优语境归调优
  - context:
    - '*'
    target: specialists/io-analysis
    note: 默认归 IO 域
- keyword: 磁盘IO慢
  rules:
  - context:
    - 性能
    - 调优
    target: workflow/perf-tuning
    note: 性能调优语境
  - context:
    - '*'
    target: specialists/io-analysis
    note: 默认归 IO 域
- keyword: NUMA
  rules:
  - context:
    - 性能
    - 调优
    - 绑定
    target: workflow/perf-tuning
    note: 性能调优语境
  - context:
    - '*'
    target: specialists/memory-analysis
    note: 默认归内存域
- keyword: 权限不足
  rules:
  - context:
    - 磁盘
    - 文件
    - 挂载
    - 存储
    target: specialists/io-analysis
    note: 存储/文件权限归 IO
  - context:
    - '*'
    target: specialists/security-assistant
    note: 默认归安全域
- keyword: 权限被拒绝
  rules:
  - context:
    - 磁盘
    - 文件
    - 挂载
    target: specialists/io-analysis
    note: 存储/文件权限归 IO
  - context:
    - '*'
    target: specialists/security-assistant
    note: 默认归安全域
- keyword: 集群状态异常
  rules:
  - context:
    - pod
    - 节点
    - k8s
    - 容器
    target: specialists/k8s-health
    note: 容器集群语境归 k8s
  - context:
    - 存储
    - ceph
    - 磁盘
    target: specialists/io-analysis
    note: 存储集群语境归 IO
  - context:
    - '*'
    action: clarify
    note: 先澄清：是 K8s 集群还是存储集群？
- keyword: firewalld
  rules:
  - context:
    - 安全
    - 入侵
    - 合规
    - 基线
    target: specialists/security-assistant
    note: 安全语境归安全域
  - context:
    - '*'
    target: specialists/network-analysis
    note: 默认归网络域（防火墙工具）
- keyword: PVC
  rules:
  - context:
    - pod
    - 存储类
    - k8s
    target: specialists/k8s-health
    note: K8s 存储声明归 k8s
  - context:
    - '*'
    target: specialists/io-analysis
    note: 默认归 IO 存储域
