slug: specialists/network-analysis
name: 网络分析Agent
layer: expert
kind: llm
status: active
temperature: 0.1
max_iterations: 10
prompt_file: prompt.md
prompt_includes:
- _shared/prompts/platform-matrix.md
tools:
# 显式只读采集面（最小权限收敛）：十结构化采集器 + run_readonly 白名单只读 CLI 对。
# run_approved_command(s)（破坏性受审执行）不授予——prompt 承诺「没有任何处置工具」，
# 授权面与能力声明同构；变更恒走方案审批面（平台闸门对 LLM 自主变异调用一律拒绝，
# 授予只是污染工具清单、浪费迭代并诱使模型试探）。
- server: ask-ops
  allow:
  - get_hardware_inventory
  - get_system_inventory
  - get_network_inventory
  - get_security_inventory
  - get_performance_snapshot
  - get_logs
  - get_processes
  - get_listening_ports
  - get_dir_usage
  - probe_host
  - run_readonly_command
  - run_readonly_commands
dispatch_allow: []
# spawn 白名单（批次二百零九 R4 二期/GE 二期）：可被通用顾问派工（只读诊断面，
# 变更类专家不声明——spawn 自由度只来自拓扑声明）。
spawnable_by: [platform/generalist]
route_priority: P6
route_group: network
route_desc: 主机网络分析专家：连通性/丢包/连接状态面定位（os-basics 六域之网络域）
domain:
- 网络
route_keywords:
- 网络不通
- 丢包
- 断网
- 连接超时
- DNS解析
- TLS握手
- conntrack满
- TCP重传
- 网络延迟高
- 协议栈丢包
- 链路断
- nmcli
- NetworkManager
- VLAN
- firewalld
- MTU
- DHCP
- Keepalived
- iptables
- ifcfg
- firewall-cmd
- bonding
- VRRP
- nmtui
- bridge
- HAProxy
symptoms:
- 网络
- 丢包
- 防火墙
- 路由
- DNS
- TLS
- conntrack
- TCP
- 重传
- 链路
- ping不通
- 端口不通
- 路由不通
- 虚拟机连不上网
- 防火墙规则不生效
- 网络配置不生效
- 负载均衡不生效
- 流量分发不均
- 网卡绑定失败
- 虚拟机断网
- 防火墙拦截
- DNS解析失败
- 网络丢包
