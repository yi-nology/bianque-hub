slug: specialists/k8s-health
name: K8s 健康分析专家
layer: expert
kind: llm
temperature: 0.2
max_iterations: 16 # 集群排查链长(列ns→逐ns定位pod→get-logs),8 轮会中途截断(2026-09-21 实测)
prompt_file: prompt.md
route_priority: P2
route_group: kubernetes
# 关键词纪律（2026-09-19）：禁裸泛词（k8s/kubernetes/pod 曾在 P2 劫持「什么是 Kubernetes」
# 类概念问句，抢在概念类降级之前派发域检查）——只收复合限定的诊断意图词。
route_keywords: [k8s健康, k8s集群健康, k8s集群状态, k8s集群诊断, k8s节点异常, pod驱逐, 拉不起来, k8sgpt分析, 集群日志, pod日志, k8s日志, 节点日志, etcd, StorageClass, NetworkPolicy, ConfigMap, StatefulSet, ErrImagePull, ImagePullBackOff, pod镜像拉取失败]
symptoms: [pod重启, crashloop, OOMKilled, 节点NotReady, 调度失败, pod状态异常, pod一直重启, 节点故障, 节点失联, pod调度失败, pod无法启动, 网络策略不生效, 节点状态异常]
# 路由描述（LLM 语义面）：日志/事件/资源诉求凡涉及集群、pod、命名空间语境即指向本专家
#（2026-09-21 k8s 106 审计：无关键词的「捞 pod 错误日志」曾被派到本地日志域在服务本机空转）。
route_desc: K8s 集群诊断与日志采集（k8sgpt）：凡涉及 Kubernetes 集群、pod、节点、命名空间的健康检查、错误日志捞取、事件排查、资源状态查询
dispatch_allow: []
# spawn 白名单（批次二百零九 R4 二期/GE 二期）：可被通用顾问派工（只读诊断面，
# 变更类专家不声明——spawn 自由度只来自拓扑声明）。
spawnable_by: [platform/generalist]
tools:
  # 工具名以 k8sgpt 0.4.39 实测为准（12 工具全集见本包 README「K8s 集群诊断域」；契约清单随 k8s-ops 包 mcp/k8sgpt.yaml——同名 server 契约单源，避免双包重名冲突）；v1 白名单只放诊断面。
  - server: k8sgpt
    allow: [analyze, cluster-info, get-logs, get-resource, list-events, list-namespaces, list-resources]
skills:
  - k8s-node-diagnosis
