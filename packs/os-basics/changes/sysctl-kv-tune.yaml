# 编目变更块（批次九十四「诊断+处方+受审执行」首批参考件）。
# 契约见主仓 docs/PACK_GUIDE.md §4.2.5；治理红线：包侧只声明编目，
# 审批/执行/验证归平台——本文件不写任何治理节点。
# verify_readonly 已接入自动执行（批次九十五二阶段 RenderVerify 参数代换）：
# 变更后 post-verify 自动跑 sysctl -n <key> 断言运行时值生效——占位符与 commands 同口径。
api_version: 1
slug: sysctl-kv-tune
title: sysctl 内核参数调优（运行时 + 持久化）
request_type: tune
risk: 2
rollback: "sysctl -w <key>=<旧值>（变更前基线由平台执行前只读快照留痕）；从 /etc/sysctl.d/99-bq-tune.conf 删除该 key 的持久化行（按行首 key= 匹配 sed 删除）"
verify_readonly:
  - "sysctl -n {{key}}"
params:
  - name: key
    kind: string
    required: true
  - name: value
    kind: string
    required: true
commands:
  # 持久化为按 key 幂等 upsert：已存在该行则原位改写，不存在才追加——
  # 整文件覆盖形态会在同站点第二次调参时抹掉首次参数（重启后回退），已废弃。
  - "sysctl -w {{key}}={{value}}"
  - "grep -qE '^{{key}}[[:space:]]*=' /etc/sysctl.d/99-bq-tune.conf && sed -i 's#^{{key}}[[:space:]]*=.*#{{key}} = {{value}}#' /etc/sysctl.d/99-bq-tune.conf || echo '{{key}} = {{value}}' >> /etc/sysctl.d/99-bq-tune.conf"
