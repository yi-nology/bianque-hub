slug: imports/web-inspector
name: 网页巡检取证专家
layer: expert
kind: llm
temperature: 0.2
max_iterations: 10
prompt_file: prompt.md
skills:
  - web-console-screenshot
  - spa-render-diagnosis
tools:
  - server: browser-ops
    # 显式全量白名单（最小权限收敛，bianque 批次二百六十四）：只读档五工具自由采集；
    # 执行档三工具（click/type/eval）是技能钉扎的设计能力（spa-render-diagnosis 的
    # eval 只读三连等），prompt 已带执行档纪律（必须说明必要性/严禁 eval 绕只读档）；
    # browser-ops server 治理缺省硬关（装包≠开洞），显式列出防 allow 空=全量漂移。
    allow:
      - browser_open
      - browser_content
      - browser_screenshot
      - browser_tabs
      - browser_close
      - browser_click
      - browser_type
      - browser_eval
dispatch_allow: []
route_priority: P4
route_group: tooling
route_keywords: [网页巡检, 页面取证, 网页取证, 网站截图诊断, spa白屏, 页面渲染异常]
symptoms: [网页打不开, 页面白屏, 网页内容异常, 截图取证]
route_desc: 网页巡检取证专家：无头 Chromium 渲染采集（正文/截图/控制台态）与 SPA 白屏判读——browser-ops 只读档优先，交互动作仅受审使用
pluggable: true
