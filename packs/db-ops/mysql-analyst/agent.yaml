slug: imports/mysql-analyst
name: MySQL 诊断专家
layer: expert
kind: llm
temperature: 0.2
max_iterations: 24
prompt_file: prompt.md
skills:
  - mysql-triage
  - mysql-replication
tools:
  - server: ask-ops
    # 显式只读采集面（最小权限收敛，bianque 批次二百六十四）：十结构化采集器+probe_host
    # +run_readonly 白名单只读 CLI 对（域内 CLI 取证）；run_approved_*（破坏性受审执行）
    # 不授予——分析专家=只读采集判读域（prompt 零变更工具引用），变更恒走方案审批面。
    allow:
      - get_hardware_inventory
      - get_system_inventory
      - get_network_inventory
      - get_security_inventory
      - get_performance_snapshot
      - get_logs
      - get_processes
      - get_listening_ports
      - get_dir_usage
      - probe_host
      - run_readonly_command
      - run_readonly_commands
dispatch_allow: []
route_priority: P3
route_group: storage
route_keywords: [mysql诊断, 数据库连接打满, 慢查询, 锁等待, 行锁堵塞, innodb诊断, 主从延迟, binlog堆积]
symptoms: [数据库慢, 连接耗尽, 锁表, 查询堆积, 磁盘涨]
route_desc: MySQL 深诊专家：连接面/锁与事务/慢查询/容量五类分诊 + 复制链专项判读（ask-ops 只读采集面）
pluggable: true
