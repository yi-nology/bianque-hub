# 编目变更块（批607 能力普及轮 nginx-ops 首批；承接 lifecycle 技能「-t 前置纪律」方法论）。
# 契约见主仓 docs/PACK_GUIDE.md §4.2.5；治理红线：包侧只声明编目，
# 审批/执行/验证归平台——本文件不写任何治理节点。
# 方法论依据：nginx-lifecycle-ops「-t 前置纪律 + reload 进程语义差（master/worker
# 继承与连接排空）」——配置变更后的生效动作恒为「先 -t 再 reload」；
# -t 通过前提下 reload 失败不影响在跑 worker（连接排空语义），天然可重试。
# verify_readonly 走 ask-ops 只读面（nginx -t / systemctl is-active 在采集面）。
api_version: 1
slug: nginx-config-reload
title: Nginx 配置校验通过后平滑重载（nginx -t && reload）
request_type: reload
risk: 2
rollback: "reload 失败不影响在跑 worker（-t 通过前提下旧连接继续排空）；配置回退=恢复变更前备份配置文件后再跑一次本卡（-t 与 reload 同闸）——变更前配置由平台执行前只读快照（nginx -T）留痕"
verify_readonly:
  - "nginx -t"
  - "systemctl is-active nginx"
commands:
  - "nginx -t && systemctl reload nginx"
