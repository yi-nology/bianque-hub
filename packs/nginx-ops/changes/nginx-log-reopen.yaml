# 编目变更块（批607 能力普及轮 nginx-ops 首批；承接 lifecycle 技能「logrotate 与 USR1」方法论）。
# 契约见主仓 docs/PACK_GUIDE.md §4.2.5；治理红线：包侧只声明编目，
# 审批/执行/验证归平台——本文件不写任何治理节点。
# 方法论依据：nginx-lifecycle-ops「日志文件句柄不释放=轮转后缺 USR1」——
# logrotate/手工轮转后 nginx 持旧句柄继续写旧文件，reopen 是标准收口动作；
# reopen 只重开日志文件，不中断服务（USR1 信号语义）。
# verify_readonly 走 ask-ops 只读面（ls -l /proc/$(pgrep nginx|head -1)/fd 核对句柄指向）。
api_version: 1
slug: nginx-log-reopen
title: Nginx 日志轮转后重开日志文件（nginx -s reopen / USR1）
request_type: reload
risk: 1
rollback: "reopen 只重开日志文件描述符，不改任何配置与服务状态——无需回退；执行前旧日志文件路径由 verify_readonly 句柄核对留痕（轮转后应指向新文件）"
verify_readonly:
  - "ls -l /proc/$(pgrep nginx | head -1)/fd 2>/dev/null | grep -c access.log"
commands:
  - "nginx -s reopen"
