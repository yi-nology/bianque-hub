# Nginx 可用性诊断链（批607 C 段；nginx-ops 首条链资产）：两步收口——
# 可用性面分诊（502/504/连接拒/worker 打满）→ 路由面深挖（404/重定向循环/location）。
# 与 nginx-platform-analyst 专家入口（单点问答）错位：链入口带自有关键词直达，
# 是「nginx 一次查清」类诉求的可靠通道；路由词避开「巡检/体检」域词防劫持全域入口。
#
# v3 图模型（spec 2026-10-22 §5.1）：节点 + 边。模板变量用 {{sys.input}}。
slug: workflow/nginx-availability-audit
name: Nginx 可用性诊断链
version: 3
route_priority: P3
route_group: middleware
route_keywords: [nginx诊断链, nginx可用性链, 502诊断链]
symptoms: [nginx链]
route_desc: Nginx 两步诊断（可用性面分诊 → 路由面深挖）；单点配置问答请走 Nginx 平台诊断专家入口
nodes:
  - id: n1
    type: agent
    title: 可用性面分诊
    agent: imports/nginx-platform-analyst
    skill: nginx-availability-triage # 技能钉扎：分诊方法论全文强制注入执行
    instruction: "第一步——对目标主机 Nginx 做可用性面分诊（502/504/连接拒绝/worker 打满四路，upstream 与进程/端口事实采集）：{{sys.input}}"
  - id: n2
    type: agent
    title: 路由面深挖
    agent: imports/nginx-platform-analyst
    skill: nginx-route-triage # 技能钉扎：可用性面已排除时按路由方法论深挖
    instruction: "第二步——基于上一步可用性结论，按路由分诊方法论深挖（404/重定向循环/location/try_files 配置与运行时 diff）：{{sys.input}}"
edges:
  - {from: n1, to: n2}
