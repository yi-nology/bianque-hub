slug: imports/obs-analyst
name: 可观测自诊专家
layer: expert
kind: llm
temperature: 0.2
max_iterations: 24
prompt_file: prompt.md
skills:
  - prometheus-triage
  - grafana-triage
  - es-triage
  - loki-triage
tools:
  - server: ask-ops
    # 显式只读采集面（最小权限收敛，bianque 批次二百六十四）：十结构化采集器+probe_host
    # +run_readonly 白名单只读 CLI 对（域内 CLI 取证）；run_approved_*（破坏性受审执行）
    # 不授予——分析专家=只读采集判读域（prompt 零变更工具引用），变更恒走方案审批面。
    allow:
      - get_hardware_inventory
      - get_system_inventory
      - get_network_inventory
      - get_security_inventory
      - get_performance_snapshot
      - get_logs
      - get_processes
      - get_listening_ports
      - get_dir_usage
      - probe_host
      - run_readonly_command
      - run_readonly_commands
  - server: datasources          # loki-triage 采集面（查询类走只读查询面，不经命令通道）
    allow: [loki_query_range, loki_labels]
dispatch_allow: []
route_priority: P3
route_group: monitoring
route_keywords: [监控失明, 采集断点, target掉线, 告警失效, prometheus排障, 面板无数据, grafana排障, es集群红, 分片未分配, 监控栈排障, loki排障, 日志断流, logql查询失败]
symptoms: [指标断了, 无数据, 图表空白, 告警没响, 监控慢]
route_desc: 监控栈自诊专家（“监控系统的监控”）：Prometheus 采集/规则面、Grafana 数据源/面板面、ES 集群/分片面、Loki 日志查询面分诊判读（ask-ops 只读采集面 + datasources Loki 查询面）；用监控数据查业务问题请走平台监控查询入口
pluggable: true
