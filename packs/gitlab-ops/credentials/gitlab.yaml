# GitLab 自托管实例凭证（gitlab-ops 包分发类型，趟通「新系统=内容资产」包分发扩展主轴）：
# PRIVATE-TOKEN 头（PAT，建议 read_api scope）+ /api/v4/user 鉴权探测（200=凭证有效/
# 401=token 无效过期——依赖平台 HTTP 探测 headers 能力，此前裸 GET 只能验网线）。
# 技能正文约定 GITLAB_TOKEN/GITLAB_URL env，经 inject.env 供给消费方子进程（站点 conf
# 需在对应 MCP server credentials 声明加 gitlab:*——装包≠开洞，注入面由站点决策）。
api_version: credential.bianque.io/v1
kind: CredentialType
metadata:
  name: gitlab
  title: GitLab
  maturity: experimental
  category: devops
spec:
  fields:
    - name: base_url
      title: 实例地址
      kind: string
      required: true
      placeholder: "https://gitlab.example.com"
      help: "自托管实例根地址"
    - name: token
      title: Personal Access Token
      kind: secret
      required: true
      placeholder: "glpat-..."
      help: "建议 read_api scope（只读采集面）；需要写操作再加 api scope"
  test:
    http:
      url: "${base_url}/api/v4/user"
      headers:
        PRIVATE-TOKEN: "${token}"
      expect_status: "200"
      help: "鉴权探测：200=凭证有效；401=token 无效/过期（与裸 GET 可达性探测不同，这里验的是凭证本身）"
  inject:
    env:
      - name: GITLAB_URL
        value: "${base_url}"
      - name: GITLAB_TOKEN
        value: "${token}"
