slug: imports/gitlab-platform-analyst
name: GitLab 平台诊断专家
layer: expert
kind: llm
temperature: 0.2
max_iterations: 24
prompt_file: prompt.md
skills:
  - gitlab-instance-triage
  - gitlab-repo-triage
  - gitlab-auth-triage
  - gitlab-lifecycle-ops
tools:
  - server: ask-ops
    # 显式只读采集面（最小权限收敛，bianque 批次二百六十四）：十结构化采集器+probe_host
    # +run_readonly 白名单只读 CLI 对（域内 CLI 取证）；run_approved_*（破坏性受审执行）
    # 不授予——分析专家=只读采集判读域（prompt 零变更工具引用），变更恒走方案审批面。
    allow:
      - get_hardware_inventory
      - get_system_inventory
      - get_network_inventory
      - get_security_inventory
      - get_performance_snapshot
      - get_logs
      - get_processes
      - get_listening_ports
      - get_dir_usage
      - probe_host
      - run_readonly_command
      - run_readonly_commands
dispatch_allow: []
route_priority: P3
route_group: tooling
route_keywords: [gitlab实例, gitlab实例状态, gitlab实例检查, gitlab运行状态, gitlab健康, gitlab版本检查, gitlab 实例, gitlab 实例状态, gitlab 运行状态, gitlab 健康, gitlab 版本, gitlab 打不开, gitlab 502, gitlab实例故障, gitlab平台排障, gitlab 502, gitlab运维, gitlab推代码失败, git push失败, gitlab克隆失败, gitaly异常, gitlab备份恢复, gitlab升级失败, gitlab登录不上, gitlab LDAP排障, gitlab密钥丢失]
symptoms: [gitlab打不开, push被拒, 仓库打不开, gitlab登录异常, gitlab超时]
route_desc: GitLab 自托管平台深诊专家：实例本体（502/打不开/readiness 分项）、仓库推拉面（push/clone 失败/gitaly/盘满）、认证权限面（登录/LDAP/token/封禁）、生命周期（备份/升级/secrets/license）四面分诊判读（ask-ops 只读采集面）；CI 流水线与 runner 作业面走 cicd-ops，bundled PostgreSQL/Redis 本体深挖走 db-ops/mw-ops
pluggable: true
