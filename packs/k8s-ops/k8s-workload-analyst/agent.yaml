slug: imports/k8s-workload-analyst
name: K8s 工作负载分析专家
layer: expert
kind: llm
temperature: 0.2
max_iterations: 28
prompt_file: prompt.md
skills:
  - k8s-workload-triage
  - k8s-events-timeline
  - k8s-helm-ops
  - k8s-certs-ops
tools:
  - server: k8sgpt
    allow: [analyze, cluster-info, get-logs, get-resource, list-events, list-namespaces, list-resources]
  - server: ask-ops            # 宿主侧只读命令面：k8s-helm-ops/k8s-certs-ops 处方的 helm/kubeadm/kubectl 只读子命令
    # 显式只读采集面（最小权限收敛，bianque 批次二百六十四）：十结构化采集器+probe_host
    # +run_readonly 白名单只读 CLI 对（域内 CLI 取证）；run_approved_*（破坏性受审执行）
    # 不授予——分析专家=只读采集判读域（prompt 零变更工具引用），变更恒走方案审批面。
    allow:
      - get_hardware_inventory
      - get_system_inventory
      - get_network_inventory
      - get_security_inventory
      - get_performance_snapshot
      - get_logs
      - get_processes
      - get_listening_ports
      - get_dir_usage
      - probe_host
      - run_readonly_command
      - run_readonly_commands
dispatch_allow: []
route_priority: P3
route_group: kubernetes
route_keywords: [工作负载诊断, pod诊断, crashloop诊断, helm排查, k8s证书巡检, 集群事件分析]
symptoms: [工作负载异常, pod异常重启, release异常, 证书告警]
route_desc: Kubernetes 工作负载深诊专家：CrashLoopBackOff/OOMKilled/Pending 分诊、事件时间线归因、Helm release 排查与证书巡检（k8sgpt 工具面 + ask-ops 宿主侧只读命令面）
pluggable: true
