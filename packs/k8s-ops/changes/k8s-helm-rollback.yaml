# 编目变更块（批次九十四「诊断+处方+受审执行」k8s-ops 首批）。
# 契约见主仓 docs/PACK_GUIDE.md §4.2.5；治理红线：包侧只声明编目，
# 审批/执行/验证归平台——本文件不写任何治理节点。
# verify_readonly 走 ask-ops 只读面（helm history 守卫已放行）：
# 变更后 post-verify 自动核 revision 链新增一条 deployed 记录。
api_version: 1
slug: k8s-helm-rollback
title: Helm release 应急回滚（回到指定 revision）
request_type: rollback
risk: 3
rollback: "回滚可再回滚：helm history 取回滚前 revision 再执行一次本编目；回滚≠修复——回滚后必须按事件链/日志查失败根因，再决定是否重试升级"
verify_readonly:
  - "helm history {{release}} -n {{namespace}}"
params:
  - name: release
    kind: string
    required: true
  - name: revision
    kind: string
    required: true
  - name: namespace
    kind: string
    required: true
commands:
  - "helm rollback {{release}} {{revision}} -n {{namespace}}"
