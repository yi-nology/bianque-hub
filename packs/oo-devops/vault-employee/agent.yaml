slug: imports/vault-employee
name: Vault 安全管理员工
layer: expert
kind: llm
temperature: 0.3
max_iterations: 12
prompt_file: prompt.md
prompt_includes:
    - _shared/prompts/platform-matrix.md
skills:
    - SecureCodeGuardian
    - vault-ops
    - security-reviewer
tools:
    - server: ask-ops
      # 显式只读白名单（最小权限收敛，bianque 批次四百四十四装包知情同意闸对账）：
      # 十结构化采集器 + probe_host + run_readonly 只读 CLI 对（os-basics 1.7.0 同款）。
      # allow: [] 在契约里是「该 server 全量授予」，ask-ops 含破坏性受审执行
      # （run_approved_command(s)）——空 allow 按最坏记 ask-ops/* 变更面，装包/升级
      # 被知情同意闸拦截。employee/librarian 是咨询答疑面（处置恒走方案审批面），
      # 破坏性受审执行不授予。
      allow:
        - get_hardware_inventory
        - get_system_inventory
        - get_network_inventory
        - get_security_inventory
        - get_performance_snapshot
        - get_logs
        - get_processes
        - get_listening_ports
        - get_dir_usage
        - probe_host
        - run_readonly_command
        - run_readonly_commands
    - server: security-assistant
      # 显式白名单（防 allow 空=全量静默扩权）：安全巡检采集面 11 工具（与 os-basics
      # security-assistant 授予面同款）。
      allow:
        - security_inspection
        - collect_security_logs
        - collect_system_info
        - collect_process_info
        - collect_network_status
        - collect_service_info
        - collect_filesystem
        - grep_file
        - read_file
        - tail_file
        - list_directory
dispatch_allow: []
route_priority: P6
route_group: security
domain:
    - Vault 安全管理
route_keywords:
    - vault密钥
    - vault动态凭据
    - Vault 安全管理员工
    - Vault 安全管理
    - vault 安全管理
symptoms:
    - vault封印
route_desc: HashiCorp Vault 安全管理员工，支持密钥管理、访问控制、动态凭据、安全审计
