slug: imports/skywalking-employee
name: SkyWalking APM 员工
layer: expert
kind: llm
temperature: 0.3
max_iterations: 12
prompt_file: prompt.md
prompt_includes:
    - _shared/prompts/platform-matrix.md
skills:
    - skywalking-ops
    - managing-skywalking
    - monitoring-expert
    - skywalking-compile
    - sentry-observability
    - db-readonly
    - a7-plugin-skywalking
    - skywalking-run-e2e
    - skywalking-compiling
    - skywalking-gh-pull-request
    - a6-plugin-skywalking
tools:
    - server: ask-ops
      # 显式只读白名单（最小权限收敛，bianque 批次四百四十四装包知情同意闸对账）：
      # 十结构化采集器 + probe_host + run_readonly 只读 CLI 对（os-basics 1.7.0 同款）。
      # allow: [] 在契约里是「该 server 全量授予」，ask-ops 含破坏性受审执行
      # （run_approved_command(s)）——空 allow 按最坏记 ask-ops/* 变更面，装包/升级
      # 被知情同意闸拦截。employee/librarian 是咨询答疑面（处置恒走方案审批面），
      # 破坏性受审执行不授予。
      allow:
        - get_hardware_inventory
        - get_system_inventory
        - get_network_inventory
        - get_security_inventory
        - get_performance_snapshot
        - get_logs
        - get_processes
        - get_listening_ports
        - get_dir_usage
        - probe_host
        - run_readonly_command
        - run_readonly_commands
dispatch_allow: []
route_priority: P6
route_group: monitoring
domain:
    - SkyWalking APM
route_keywords:
    - skywalking链路
    - skywalking拓扑
    - SkyWalking APM 员工
    - SkyWalking APM
    - skywalking apm
symptoms:
    - 链路追踪异常
    - 探针掉线
route_desc: SkyWalking 应用性能监控员工，支持链路追踪、指标分析、告警配置、拓扑可视化
