slug: imports/librarian-observability
name: 可观测员工
layer: expert
kind: llm
temperature: 0.3
max_iterations: 12
prompt_file: prompt.md
prompt_includes:
    - _shared/prompts/platform-matrix.md
skills:
    - algolia-observability
    - ceph-health-monitor
    - clickhouse-observability
    - grafana-dashboard-creator
    - grafana-dashboards
    - grafana-http-api
    - grafana-oncall-ops
    - grafana-tempo
    - jumpserver-skills
    - logging-observability
    - n9e-create-dashboard
    - n9e-doc-qa
    - perses-grafana-migrate
    - rpe-grafana
    - tempo-ops
tools:
    - server: ask-ops
      # 显式只读白名单（最小权限收敛，bianque 批次四百四十四装包知情同意闸对账）：
      # 十结构化采集器 + probe_host + run_readonly 只读 CLI 对（os-basics 1.7.0 同款）。
      # allow: [] 在契约里是「该 server 全量授予」，ask-ops 含破坏性受审执行
      # （run_approved_command(s)）——空 allow 按最坏记 ask-ops/* 变更面，装包/升级
      # 被知情同意闸拦截。employee/librarian 是咨询答疑面（处置恒走方案审批面），
      # 破坏性受审执行不授予。
      allow:
        - get_hardware_inventory
        - get_system_inventory
        - get_network_inventory
        - get_security_inventory
        - get_performance_snapshot
        - get_logs
        - get_processes
        - get_listening_ports
        - get_dir_usage
        - probe_host
        - run_readonly_command
        - run_readonly_commands
dispatch_allow: []
route_priority: P5
route_group: ""
domain:
    - 可观测
route_keywords:
    - 可观测技能
    - 监控告警技能
route_desc: 可观测技能库管家——监控体系领域方法：指标日志链路三大选型、告警分级与降噪、SLO 与大盘设计、值班响应口径
