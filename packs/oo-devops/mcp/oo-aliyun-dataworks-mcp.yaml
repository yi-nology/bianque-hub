# 由 bq-markettool convert 生成（员工 MCP 包声明；禁手改，改 curation/patches）。
# 引用员工: aliyun-dataworks-employee
# ⚠ 放行前必须处理: env DATAWORKS_AK_ID 值像占位符（示例文档非真实凭证）；env DATAWORKS_AK_SECRET 键名疑似密钥 → 建议改凭证平面 credential_ref
# 激活: etc/config-<env>.yaml mcp.servers 加同名条目（enabled: true + 覆盖定义）。
definition:
    command:
        - npx
        - -y
        - alibabacloud-dataworks-mcp-server
        - --transport
        - stdio
        - --access-key-id
        - ${DATAWORKS_AK_ID}
        - --access-key-secret
        - ${DATAWORKS_AK_SECRET}
        - --region-id
        - cn-hangzhou
        - --endpoint
        - dataworks-public.cn-hangzhou.aliyuncs.com
    env:
        - DATAWORKS_AK_ID=你的阿里云AK ID
        - DATAWORKS_AK_SECRET=你的阿里云AK Secret
    selfcheck: false
    timeout: 30s
enabled: false
name: oo-aliyun-dataworks-mcp
