# 由 bq-markettool convert 生成（员工 MCP 包声明；禁手改，改 curation/patches）。
# 引用员工: ansible-employee
# 激活: etc/config-<env>.yaml mcp.servers 加同名条目（enabled: true + 覆盖定义）。
# 激活对账提示：本契约是工具面事实记录，server 激活（conf mcp.servers 加同名条目）后，
# 须同步给引用员工 agent.yaml 的 tools 增加同名 server 授权——契约在而授权缺=拉起了
# server 专家却用不了（hub 契约模型：tools[].server 是授权面）。
definition:
    command:
        - npx
        - -y
        - ansible-mcp-server
        - --transport
        - stdio
        - --ansible-config
        - /root/ansible/ansible.cfg
        - --ssh-key
        - /root/.ssh/id_rsa
        - --inventory
        - /root/ansible/inventory.ini
    env:
        - ANSIBLE_CONFIG=/root/ansible/ansible.cfg
        - ANSIBLE_INVENTORY=/root/ansible/inventory.ini
        - SSH_KEY_PATH=/root/.ssh/id_rsa
    selfcheck: false
    timeout: 30s
enabled: false
name: oo-ansible-mcp
