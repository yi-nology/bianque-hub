# 由 bq-markettool convert 生成（员工 MCP 包声明；禁手改，改 curation/patches）。
# 引用员工: ansible-employee
# 激活: etc/config-<env>.yaml mcp.servers 加同名条目（enabled: true + 覆盖定义）。
definition:
    command:
        - npx
        - -y
        - ansible-mcp-server
        - --transport
        - stdio
        - --ansible-config
        - /root/ansible/ansible.cfg
        - --ssh-key
        - /root/.ssh/id_rsa
        - --inventory
        - /root/ansible/inventory.ini
    env:
        - ANSIBLE_CONFIG=/root/ansible/ansible.cfg
        - ANSIBLE_INVENTORY=/root/ansible/inventory.ini
        - SSH_KEY_PATH=/root/.ssh/id_rsa
    selfcheck: false
    timeout: 30s
enabled: false
name: oo-ansible-mcp
