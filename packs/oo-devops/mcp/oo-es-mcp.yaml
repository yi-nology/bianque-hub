definition:
    command:
        - npx
        - -y
        - '@octodet/elasticsearch-mcp'
        - stdio
    env:
        - ES_PASSWORD=your_password
        - ES_URL=http://IP:9200
        - ES_USERNAME=elastic
        - ES_VERSION=8
    selfcheck: false
    timeout: 30s
enabled: false
name: oo-es-mcp
