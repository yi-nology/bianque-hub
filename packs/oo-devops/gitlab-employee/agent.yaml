slug: imports/gitlab-employee
name: GitLab DevOps 员工
layer: expert
kind: llm
temperature: 0.3
max_iterations: 12
prompt_file: prompt.md
prompt_includes:
    - _shared/prompts/platform-matrix.md
skills:
    - gitlab-cli-skills
    - gitlab-ops
    - devops-engineer
    - gitlab-manager
    - haproxy-ops
    - kubernetes-devops
    - release-engineering
    - redis-ops
    - cicd-pipeline-generator
    - azure-devops
    - sre-fundamentals
    - vmware-vsphere-ops
    - sre-engineer
    - minio-ops
    - dns-ops
tools:
    - server: ask-ops
      # 显式只读白名单（最小权限收敛，bianque 批次四百四十四装包知情同意闸对账）：
      # 十结构化采集器 + probe_host + run_readonly 只读 CLI 对（os-basics 1.7.0 同款）。
      # allow: [] 在契约里是「该 server 全量授予」，ask-ops 含破坏性受审执行
      # （run_approved_command(s)）——空 allow 按最坏记 ask-ops/* 变更面，装包/升级
      # 被知情同意闸拦截。employee/librarian 是咨询答疑面（处置恒走方案审批面），
      # 破坏性受审执行不授予。
      allow:
        - get_hardware_inventory
        - get_system_inventory
        - get_network_inventory
        - get_security_inventory
        - get_performance_snapshot
        - get_logs
        - get_processes
        - get_listening_ports
        - get_dir_usage
        - probe_host
        - run_readonly_command
        - run_readonly_commands
dispatch_allow: []
route_priority: P6
route_group: tooling
domain:
    - GitLab DevOps
route_keywords:
    - gitlab流水线
    - gitlab-ci
    - GitLab DevOps 员工
    - GitLab DevOps
    - gitlab devops
symptoms:
    - gitlab-runner掉线
route_desc: GitLab 全流程 DevOps 员工，支持代码审查、CI/CD 配置、版本管理、容器镜像构建
