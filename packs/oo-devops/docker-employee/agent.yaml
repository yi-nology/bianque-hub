slug: imports/docker-employee
name: Docker 容器运维员工
layer: expert
kind: llm
temperature: 0.3
max_iterations: 12
prompt_file: prompt.md
prompt_includes:
    - _shared/prompts/platform-matrix.md
skills:
    - docker-sandbox
    - MicroservicesArchitect
    - docker-ops
    - k8s-kind
    - k8s-dev-deploy
tools:
    - server: ask-ops
      # 显式只读白名单（最小权限收敛，bianque 批次四百四十四装包知情同意闸对账）：
      # 十结构化采集器 + probe_host + run_readonly 只读 CLI 对（os-basics 1.7.0 同款）。
      # allow: [] 在契约里是「该 server 全量授予」，ask-ops 含破坏性受审执行
      # （run_approved_command(s)）——空 allow 按最坏记 ask-ops/* 变更面，装包/升级
      # 被知情同意闸拦截。employee/librarian 是咨询答疑面（处置恒走方案审批面），
      # 破坏性受审执行不授予。
      allow:
        - get_hardware_inventory
        - get_system_inventory
        - get_network_inventory
        - get_security_inventory
        - get_performance_snapshot
        - get_logs
        - get_processes
        - get_listening_ports
        - get_dir_usage
        - probe_host
        - run_readonly_command
        - run_readonly_commands
dispatch_allow: []
route_priority: P6
route_group: kubernetes
domain:
    - Docker 容器
route_keywords:
    - docker容器
    - docker镜像
    - Docker 容器运维员工
    - Docker 容器
    - docker 容器
symptoms:
    - 容器退出
    - docker磁盘占用
route_desc: Docker 单机容器——容器生命周期与 exec 现场、镜像构建与加载、compose 编排、bridge 网络与数据卷。K8s 集群走 k8s、镜像仓库走 harbor
