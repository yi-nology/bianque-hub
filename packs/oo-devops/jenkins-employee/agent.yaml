slug: imports/jenkins-employee
name: Jenkins CI/CD 员工
layer: expert
kind: llm
temperature: 0.3
max_iterations: 12
prompt_file: prompt.md
prompt_includes:
    - _shared/prompts/platform-matrix.md
skills:
    - jenkins-ops
    - devops-engineer
    - release-engineering
tools:
    - server: ask-ops
      # 显式只读白名单（最小权限收敛，bianque 批次四百四十四装包知情同意闸对账）：
      # 十结构化采集器 + probe_host + run_readonly 只读 CLI 对（os-basics 1.7.0 同款）。
      # allow: [] 在契约里是「该 server 全量授予」，ask-ops 含破坏性受审执行
      # （run_approved_command(s)）——空 allow 按最坏记 ask-ops/* 变更面，装包/升级
      # 被知情同意闸拦截。employee/librarian 是咨询答疑面（处置恒走方案审批面），
      # 破坏性受审执行不授予。
      allow:
        - get_hardware_inventory
        - get_system_inventory
        - get_network_inventory
        - get_security_inventory
        - get_performance_snapshot
        - get_logs
        - get_processes
        - get_listening_ports
        - get_dir_usage
        - probe_host
        - run_readonly_command
        - run_readonly_commands
dispatch_allow: []
route_priority: P6
route_group: tooling
domain:
    - Jenkins CI/CD
route_keywords:
    - jenkins流水线
    - jenkins构建失败
    - Jenkins CI/CD 员工
    - Jenkins CI/CD
    - jenkins ci/cd
symptoms:
    - jenkins节点离线
route_desc: Jenkins 持续集成/持续部署员工，支持流水线管理、构建优化、插件配置、发布自动化
