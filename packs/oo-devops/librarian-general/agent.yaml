slug: imports/librarian-general
name: 综合运维员工
layer: expert
kind: llm
temperature: 0.3
max_iterations: 12
prompt_file: prompt.md
prompt_includes:
    - _shared/prompts/platform-matrix.md
skills:
    - analyzing-kubernetes-audit-logs
    - clscli
    - debugging-wizard
    - fd-find
    - fluentd-ops
    - gitbackup
    - hwc-infra
    - istio-ops
    - k8s-autoscaling
    - k8s-capi
    - k8s-cilium
    - k8s-debug-pods
    - k8s-helm
    - k8s-multicluster
    - k8s-networking
    - k8s-operator-change
    - k8s-policy
    - k8s-service-mesh
    - kubernetes-specialist
    - kvm-qemu-ops
    - loki-config-generator
    - loki-logs
    - loki-mode
    - loki-principal-engineer
    - loki-search
    - loki-troubleshoot
    - memcached-ops
    - microceph
    - oss-bucket-exploit
    - rook-ceph
    - sentry-cli
    - systems-architect
    - teams-anthropic-integration
    - trivy-ops
    - tsh-implementing-kubernetes
    - wireshark-ops
tools:
    - server: ask-ops
      # 显式只读白名单（最小权限收敛，bianque 批次四百四十四装包知情同意闸对账）：
      # 十结构化采集器 + probe_host + run_readonly 只读 CLI 对（os-basics 1.7.0 同款）。
      # allow: [] 在契约里是「该 server 全量授予」，ask-ops 含破坏性受审执行
      # （run_approved_command(s)）——空 allow 按最坏记 ask-ops/* 变更面，装包/升级
      # 被知情同意闸拦截。employee/librarian 是咨询答疑面（处置恒走方案审批面），
      # 破坏性受审执行不授予。
      allow:
        - get_hardware_inventory
        - get_system_inventory
        - get_network_inventory
        - get_security_inventory
        - get_performance_snapshot
        - get_logs
        - get_processes
        - get_listening_ports
        - get_dir_usage
        - probe_host
        - run_readonly_command
        - run_readonly_commands
dispatch_allow: []
route_priority: P5
route_group: ""
route_keywords: [综合运维技能, 运维技能库, 技能管家]
domain:
    - 综合运维
route_desc: 综合运维技能库管家——无明确产品归属的方法论兜底：Linux 系统、网络基础、存储备份、监控选型、脚本自动化通用口径
