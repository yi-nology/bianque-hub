slug: imports/aliyun-dataworks-employee
name: 阿里云 DataWorks 智能员工
layer: expert
kind: llm
temperature: 0.3
max_iterations: 12
prompt_file: prompt.md
prompt_includes:
    - _shared/prompts/platform-matrix.md
skills:
    - alicloud-ops
    - alicloud-database-analyticdb-mysql
    - database-optimizer
    - database-schema-designer
    - alicloud-network-dns-cli
    - alicloud-platform-multicloud-docs-api-benchmark
    - alicloud-platform-docs-api-review
    - alicloud-security-kms
    - alicloud-observability-sls-log-query
    - alicloud-compute-swas-open
    - alicloud-security-center-sas
    - cinience-alicloud-database-rds-supabase
    - alicloud-backup-bdrc
tools:
    - server: ask-ops
      # 显式只读白名单（最小权限收敛，bianque 批次四百四十四装包知情同意闸对账）：
      # 十结构化采集器 + probe_host + run_readonly 只读 CLI 对（os-basics 1.7.0 同款）。
      # allow: [] 在契约里是「该 server 全量授予」，ask-ops 含破坏性受审执行
      # （run_approved_command(s)）——空 allow 按最坏记 ask-ops/* 变更面，装包/升级
      # 被知情同意闸拦截。employee/librarian 是咨询答疑面（处置恒走方案审批面），
      # 破坏性受审执行不授予。
      allow:
        - get_hardware_inventory
        - get_system_inventory
        - get_network_inventory
        - get_security_inventory
        - get_performance_snapshot
        - get_logs
        - get_processes
        - get_listening_ports
        - get_dir_usage
        - probe_host
        - run_readonly_command
        - run_readonly_commands
    - server: datasources
      # 显式全量白名单（防 allow 空=全量在新工具注册时静默扩权）：datasources 目录
      # 七工具全列（prometheus/loki 采集 + n8n API 查询），零能力损失。
      allow:
        - prom_query
        - loki_query_range
        - loki_labels
        - n8n_list_workflows
        - n8n_get_workflow
        - n8n_list_executions
        - n8n_get_execution
dispatch_allow: []
route_priority: P6
route_group: infra
domain:
    - 阿里云 DataWorks 智能
route_keywords:
    - dataworks任务
    - 数据工场运维
    - 阿里云 DataWorks 智能员工
    - 阿里云 DataWorks 智能
    - 阿里云 dataworks 智能
symptoms:
    - dataworks调度失败
route_desc: 阿里云 DataWorks 智能员工，支持任务管理、运行监控、调度管理、日志查询、数据开发辅助
