slug: imports/librarian-data
name: 数据技术员工
layer: expert
kind: llm
temperature: 0.3
max_iterations: 12
prompt_file: prompt.md
prompt_includes:
    - _shared/prompts/platform-matrix.md
skills:
    - amazon-aurora-dsql
    - bobagent-conventional-commits
    - influxdb-ops
    - n9e-host-health-diagnose
    - oceanbase-design-usage
    - oceanbase-ops
    - opengauss-ops
    - opentelemetry-ops
    - spark-engineer
    - sql-server
    - tidb-ops
    - volcengine-database-rds
    - wireshark-analysis
    - wireshark-network-traffic-analysis
tools:
    - server: ask-ops
      # 显式只读白名单（最小权限收敛，bianque 批次四百四十四装包知情同意闸对账）：
      # 十结构化采集器 + probe_host + run_readonly 只读 CLI 对（os-basics 1.7.0 同款）。
      # allow: [] 在契约里是「该 server 全量授予」，ask-ops 含破坏性受审执行
      # （run_approved_command(s)）——空 allow 按最坏记 ask-ops/* 变更面，装包/升级
      # 被知情同意闸拦截。employee/librarian 是咨询答疑面（处置恒走方案审批面），
      # 破坏性受审执行不授予。
      allow:
        - get_hardware_inventory
        - get_system_inventory
        - get_network_inventory
        - get_security_inventory
        - get_performance_snapshot
        - get_logs
        - get_processes
        - get_listening_ports
        - get_dir_usage
        - probe_host
        - run_readonly_command
        - run_readonly_commands
dispatch_allow: []
route_priority: P5
route_group: ""
domain:
    - 数据技术
route_keywords:
    - 数据技术技能
    - 数据库选型
route_desc: 数据技术技能库管家——数据平台领域方法：数仓建模口径、ETL 与调度链路、Kafka/Flink 数据流、备份容灾与数据一致性
