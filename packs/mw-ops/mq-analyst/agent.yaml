slug: imports/mq-analyst
name: 消息队列分析专家
layer: expert
kind: llm
temperature: 0.2
max_iterations: 24
prompt_file: prompt.md
skills:
  - kafka-triage
  - rabbitmq-triage
tools:
  - server: ask-ops
    # 显式只读采集面（最小权限收敛，bianque 批次二百六十四）：十结构化采集器+probe_host
    # +run_readonly 白名单只读 CLI 对（域内 CLI 取证）；run_approved_*（破坏性受审执行）
    # 不授予——分析专家=只读采集判读域（prompt 零变更工具引用），变更恒走方案审批面。
    allow:
      - get_hardware_inventory
      - get_system_inventory
      - get_network_inventory
      - get_security_inventory
      - get_performance_snapshot
      - get_logs
      - get_processes
      - get_listening_ports
      - get_dir_usage
      - probe_host
      - run_readonly_command
      - run_readonly_commands
dispatch_allow: []
route_priority: P3
route_group: middleware
route_keywords: [消息积压, 消费堆积, kafka诊断, 消费者掉线, isr收缩, rabbitmq诊断, 队列堆积, 消息丢失, 消息重复, rebalance风暴]
symptoms: [lag增长, 消费不动, 消息发布超时, 队列不可用, 分区掉线]
route_desc: Kafka/RabbitMQ 消息队列深诊专家：消费组积压、分区与 ISR 健康、水位告警、集群一致性与消息丢失/重复成因链（ask-ops 只读采集面）
pluggable: true
