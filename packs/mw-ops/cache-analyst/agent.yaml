slug: imports/cache-analyst
name: 缓存诊断专家
layer: expert
kind: llm
temperature: 0.2
max_iterations: 24
prompt_file: prompt.md
skills:
  - redis-triage
  - redis-hotkey-bigkey
tools:
  - server: ask-ops
    # 显式只读采集面（最小权限收敛，bianque 批次二百六十四）：十结构化采集器+probe_host
    # +run_readonly 白名单只读 CLI 对（域内 CLI 取证）；run_approved_*（破坏性受审执行）
    # 不授予——分析专家=只读采集判读域（prompt 零变更工具引用），变更恒走方案审批面。
    allow:
      - get_hardware_inventory
      - get_system_inventory
      - get_network_inventory
      - get_security_inventory
      - get_performance_snapshot
      - get_logs
      - get_processes
      - get_listening_ports
      - get_dir_usage
      - probe_host
      - run_readonly_command
      - run_readonly_commands
dispatch_allow: []
route_priority: P3
route_group: middleware
route_keywords: [缓存诊断, redis诊断, redis延迟, redis内存满, 热key, 大key, 缓存雪崩, 缓存击穿, 缓存穿透, 主从中断, redis连接打满]
symptoms: [redis慢, 缓存命中率下降, key被驱逐, redis不可达, 主从断开]
route_desc: Redis/缓存域深诊专家：内存与驱逐、热Key大Key、命中率异常、主从复制中断、连接打满五类分诊与判读（ask-ops 只读采集面）
pluggable: true
