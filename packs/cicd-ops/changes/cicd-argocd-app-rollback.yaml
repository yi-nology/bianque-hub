# 编目变更块（批次九十四「诊断+处方+受审执行」cicd-ops 首批）。
# 契约见主仓 docs/PACK_GUIDE.md §4.2.5；治理红线：包侧只声明编目，
# 审批/执行/验证归平台——本文件不写任何治理节点。
# 方法论依据：argocd-sync-triage 回滚决策——revision 取 app history 的
# rollback-version；注意 auto-sync 开启时回滚会被 Git HEAD 重新收敛，
# 回滚想留存须先暂停自动同步（暂停属自由 steps 走审批）。
# verify_readonly 走 ask-ops 只读面（argocd app history 在白名单）。
api_version: 1
slug: cicd-argocd-app-rollback
title: ArgoCD 应用回滚（rollback 到指定历史 revision）
request_type: rollback
risk: 3
rollback: "回滚可再回滚（app history 另取 revision 再 rollback）；auto-sync 开启时回滚会被下次同步收敛回 Git HEAD——想留存回滚态先暂停自动同步"
verify_readonly:
  - "argocd app history {{app}}"
params:
  - name: app
    kind: string
    required: true
  - name: revision
    kind: string
    required: true
commands:
  - "argocd app rollback {{app}} {{revision}}"
