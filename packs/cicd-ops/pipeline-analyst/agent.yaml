slug: imports/pipeline-analyst
name: 交付链分析专家
layer: expert
kind: llm
temperature: 0.2
max_iterations: 24
prompt_file: prompt.md
skills:
  - jenkins-pipeline-triage
  - gitlab-ci-triage
  - harbor-triage
  - argocd-sync-triage
tools:
  - server: ask-ops
    # 显式只读采集面（最小权限收敛，bianque 批次二百六十四）：十结构化采集器+probe_host
    # +run_readonly 白名单只读 CLI 对（域内 CLI 取证）；run_approved_*（破坏性受审执行）
    # 不授予——分析专家=只读采集判读域（prompt 零变更工具引用），变更恒走方案审批面。
    allow:
      - get_hardware_inventory
      - get_system_inventory
      - get_network_inventory
      - get_security_inventory
      - get_performance_snapshot
      - get_logs
      - get_processes
      - get_listening_ports
      - get_dir_usage
      - probe_host
      - run_readonly_command
      - run_readonly_commands
dispatch_allow: []
route_priority: P3
route_group: tooling
route_keywords: [构建失败, 流水线排障, 流水线卡住, jenkins排障, gitlabci排障, gitlab流水线失败, runner掉线, 镜像推送失败, 制品库排障, argo同步失败, 发布受阻]
symptoms: [构建报错, 构建排队, agent掉线, 同步不健康, 发布超时]
route_desc: CI/CD 交付链深诊专家：Jenkins 构建与队列、GitLab 流水线与 runner（身份预检/状态语义/trace 尾部下钻）、Harbor 制品库、ArgoCD 同步四域分诊判读（ask-ops 只读采集面）
pluggable: true
